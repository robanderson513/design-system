<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semantic color token preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #172033;
      }

      body {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin-bottom: 8px;
      }

      .intro {
        margin-top: 0;
        color: #526174;
      }

      .scale {
        margin-top: 36px;
      }

      .swatches {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
        gap: 12px;
      }

      .swatch {
        overflow: hidden;
        border: 1px solid #dce2ea;
        border-radius: 10px;
        background: white;
      }

      .color {
        min-height: 100px;
      }

      .details {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 12px;
        font-size: 14px;
      }

      .value {
        color: #526174;
        font-family: ui-monospace, monospace;
      }

      #status {
        color: #9b1c1c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Semantic colors</h1>
      <p class="intro">Color roles backed by the internal ramps in <code>tokens/primitives/colors.json</code>.</p>
    </header>
    <main id="palette" aria-live="polite"></main>
    <p id="status" role="status"></p>

    <script>
      const palette = document.querySelector('#palette');
      const status = document.querySelector('#status');

      Promise.all([
        fetch('./tokens/semantic/colors.json'),
        fetch('./tokens/primitives/colors.json')
      ])
        .then(async ([semanticResponse, primitiveResponse]) => {
          if (!semanticResponse.ok || !primitiveResponse.ok) {
            throw new Error(`Could not load tokens (${semanticResponse.status}, ${primitiveResponse.status}).`);
          }
          return Promise.all([semanticResponse.json(), primitiveResponse.json()]);
        })
        .then(([{ color }, primitives]) => {
          const resolveColor = (value) => {
            const path = value.slice(1, -1).split('.');
            const token = path.reduce((current, key) => current && current[key], primitives);
            if (!token || !Object.prototype.hasOwnProperty.call(token, '$value')) {
              throw new Error(`Unable to resolve semantic color: ${value}`);
            }
            return token.$value;
          };

          const renderToken = (name, token) => {
            if (token && Object.prototype.hasOwnProperty.call(token, '$value')) {
              const value = resolveColor(token.$value);
              const card = document.createElement('article');
              card.className = 'swatch';

              const sample = document.createElement('div');
              sample.className = 'color';
              sample.style.backgroundColor = value;
              sample.setAttribute('aria-label', `${name}: ${value}`);

              const details = document.createElement('div');
              details.className = 'details';
              const label = document.createElement('span');
              label.textContent = name;
              const colorValue = document.createElement('span');
              colorValue.className = 'value';
              colorValue.textContent = value;
              details.append(label, colorValue);

              card.append(sample, details);
              swatches.append(card);
              return;
            }

            for (const [key, value] of Object.entries(token)) {
              if (!key.startsWith('$')) renderToken(name ? `${name}.${key}` : key, value);
            }
          };

          const swatches = document.createElement('div');
          swatches.className = 'swatches';
          renderToken('', color);

          const section = document.createElement('section');
          section.className = 'scale';
          section.append(swatches);
          palette.append(section);
        })
        .catch((error) => {
          status.textContent = `${error.message} Open this page through a local HTTP server to allow it to read the token JSON.`;
        });
    </script>
  </body>
</html>
